name: Daily GitHub Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write
  actions: read

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Randomize start within the hour
        run: sleep $(( RANDOM % 3600 ))

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run agent once
        env:
          GITHUB_TOKEN: ${{ secrets.GH_AGENT_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python main.py --run-once
